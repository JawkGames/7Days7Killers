<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorgu Odası Denemesi</title>
<style>
:root{--zemin:#070808;--lamba:#e2c27a;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--zemin);overflow:hidden}
.kutu{position:relative;width:100%;height:100%;cursor:pointer;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%;touch-action:manipulation}
.alt{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:40px 16px 14px;background:linear-gradient(to top,rgba(3,4,4,.7) 20%,rgba(3,4,4,0));pointer-events:none}
.altyazi{min-height:1.3em;margin:0;font:700 clamp(20px,4.6vw,30px)/1.3 "Courier New",ui-monospace,monospace;color:#d9d2ba;text-align:center;text-shadow:0 2px 12px #000}
.konustur{pointer-events:auto;font:400 15px/1 "Courier New",ui-monospace,monospace;color:#8f8a74;background:transparent;border:1px solid rgba(143,138,116,.4);border-radius:2px;padding:9px 14px;cursor:pointer}
.konustur:hover{color:#d9d2ba;border-color:#d9d2ba}
.konustur:focus-visible{outline:2px solid var(--lamba);outline-offset:3px}
.konustur.soluk{opacity:.4}
.dugmeler{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
<!-- Sorgu odası, seçilen karakterle: sahne.html?kim=<kimlik>. Yalnızca karakter denemesi içindir. -->
<div class="kutu" id="kutu">
  <canvas id="sahne"></canvas>
  <div class="alt">
    <p class="altyazi" id="altyazi" aria-live="polite"></p>
    <div class="dugmeler"><button class="konustur" id="konustur" type="button"></button><button class="konustur" id="tekrar" type="button"></button></div>
  </div>
</div>
<script type="module">
import {tuvalKur} from '/src/cizim/teknik/tuval.js';
import {karakterSec} from '/src/cizim/rig/index.js';
import {gorunusBul} from '/src/icerik/gorunus/index.js';
import {sorguOdasiBaslat} from '/src/cizim/sahneler/sorgu-odasi/sahne.js';
import {sorguArayuzuKur} from '/src/arayuz/sorgu-arayuzu.js';
const kim=new URLSearchParams(location.search).get('kim');
const v=kim&&gorunusBul(kim);
if(v) karakterSec(v);
tuvalKur(document.getElementById('sahne'));
sorguArayuzuKur();
sorguOdasiBaslat();
</script>
</body>
</html>
