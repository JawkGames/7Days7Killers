<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Olay yeri fotoğrafı (deneme)</title>
<style>
:root{--zemin:#070605;--kagit:#8f8a74;--yazi:#d9d2ba;--morluk:#4a3a52;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--zemin);overflow:hidden;font:400 14px/1.3 "Courier New",ui-monospace,monospace;color:var(--kagit)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ust{position:fixed;left:0;right:0;top:0;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center;padding:8px 10px;
  background:linear-gradient(to bottom,rgba(3,3,2,.85),rgba(3,3,2,0));z-index:2}
.ust label{display:flex;gap:6px;align-items:center}
select,input,button{font:inherit;color:var(--kagit);background:rgba(10,9,7,.8);border:1px solid rgba(143,138,116,.35);border-radius:2px;padding:5px 8px}
input[type=number]{width:6.5em}
button{cursor:pointer}
button:hover,select:hover{color:var(--yazi);border-color:var(--yazi)}
:focus-visible{outline:2px solid #e2c27a;outline-offset:2px}
.alt{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom));text-align:center;pointer-events:none;z-index:2;
  background:linear-gradient(to top,rgba(3,3,2,.85),rgba(3,3,2,0))}
.altyazi{margin:0;min-height:1.3em;font:700 clamp(16px,4.2vw,26px)/1.3 "Courier New",ui-monospace,monospace;color:var(--yazi);text-shadow:0 2px 10px #000}
</style>
</head>
<body>
<canvas id="masa"></canvas>
<div class="ust">
  <label><span id="mekanEt"></span><select id="mekan"></select></label>
  <label><span id="tohumEt"></span><input id="tohum" type="number" min="1" step="1"></label>
  <button id="baska" type="button"></button>
  <button id="karistir" type="button"></button>
  <label><input id="kurban" type="checkbox" checked><span id="kurbanEt"></span></label>
</div>
<div class="alt"><p class="altyazi" id="altyazi" aria-live="polite"></p></div>
<script type="module" src="./demo.js"></script>
</body>
</html>
