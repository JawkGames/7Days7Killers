<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorgu Odası 3B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--zemin:#070808;--lamba:#e2c27a;--kagit:#8f8a74;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--zemin);overflow:hidden}
.kutu{position:relative;width:100%;height:100%;cursor:pointer;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%;touch-action:manipulation}
.alt{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:40px 16px 14px;background:linear-gradient(to top,rgba(3,4,4,.7) 20%,rgba(3,4,4,0));pointer-events:none}
.altyazi{min-height:1.3em;margin:0;font:700 clamp(22px,5.2vw,34px)/1.3 "Courier Prime","Courier New",ui-monospace,monospace;
  color:#d9d2ba;letter-spacing:.03em;text-align:center;text-wrap:balance;text-shadow:0 2px 12px #000}
.konustur{pointer-events:auto;font:400 15px/1 "Courier Prime","Courier New",ui-monospace,monospace;color:#8f8a74;background:transparent;
  border:1px solid rgba(143,138,116,.4);border-radius:2px;padding:9px 14px;cursor:pointer;transition:opacity .4s}
.konustur:hover{color:#d9d2ba;border-color:#d9d2ba}
.konustur:focus-visible{outline:2px solid var(--lamba);outline-offset:3px}
.konustur.soluk{opacity:.4}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div class="kutu" id="kutu">
  <canvas id="sahne" aria-label="Loş sorgu odasında, sallanan ampulün altında masanın karşısında oturup bize bakan kadın"></canvas>
  <div class="alt">
    <p class="altyazi" id="altyazi" aria-live="polite"></p>
    <button class="konustur" id="konustur" type="button">Konuşması için dokunun</button>
  </div>
</div>
<script type="module">
import * as THREE from 'three';

/* ───────────── yardımcılar ───────────── */
const TAU=Math.PI*2, V3=THREE.Vector3;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ss=(x,a,b)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)}; // a>b de olabilir
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const azHareket=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ───────────── tek yerden ayar ───────────── */
const PAL={
  ten:'#9c9480', tenIsik:'#beb59c', tenOrta:'#6d685c', tenGolge:'#3a3640', morluk:'#4a3a52',
  dudak:'#5e343a', dudakGolge:'#3a1d24', sac:'#0b0a0c', sacIsik:'#3a3128',
  iris:'#a9b3a0', murekkep:'#08070a', lamba:'#e2c27a', soguk:'#5c7479', kagit:'#8f8a74',
  ceket:'#1f2823', bluz:'#77715f', kirmizi:'#7a1f1f'
};
const OLCU={kafaY:1.27, kafaOlcek:.115, masaY:.78, kaynamaHizi:7, kameraZ:1.6, kameraY:1.5, bakY:-.16};
const poz={gx:0,gy:0,hgx:0,hgy:0,goz:.74,agizAc:0,nefes:0,isik:1,kam:0,kamY:0};
const KONUSMA={
  cumle:'O gece değirmende değildim.',
  harf:{a:.55,e:.5,'ı':.2,i:.2,o:.65,'ö':.6,u:.35,'ü':.35,m:0,b:0,p:0}, unsuz:.18,
  sure:{unlu:130,unsuz:72,dudak:88,bosluk:90,nokta:240}
};

/* ───────────── görünüm ───────────── */
const cv=document.getElementById('sahne');
const ren=new THREE.WebGLRenderer({canvas:cv,antialias:false,powerPreference:'high-performance'});
ren.shadowMap.enabled=true; ren.shadowMap.type=THREE.PCFSoftShadowMap;
const sahne=new THREE.Scene();
sahne.background=new THREE.Color('#050606');
sahne.fog=new THREE.FogExp2('#070908',.13);
const kam=new THREE.PerspectiveCamera(40,1,.05,20);

/* ───────────── kodla çizilen dokular ───────────── */
function tuval(w,h,fn,renkli=true){const k=document.createElement('canvas'); k.width=w; k.height=h; fn(k.getContext('2d'),w,h); const t=new THREE.CanvasTexture(k); if(renkli) t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t;}
function leke2(c,x,y,rx,ry,renk,a){c.save(); c.translate(x,y); c.scale(rx,ry); const g=c.createRadialGradient(0,0,0,0,0,1); g.addColorStop(0,renk.replace('A',a)); g.addColorStop(.5,renk.replace('A',a*.55)); g.addColorStop(1,renk.replace('A',0)); c.fillStyle=g; c.beginPath(); c.arc(0,0,1,0,TAU); c.fill(); c.restore();}
function kumla(c,w,h,r,g){const d=c.getImageData(0,0,w,h); for(let i=0;i<d.data.length;i+=4){const n=(r()-.5)*g; d.data[i]+=n; d.data[i+1]+=n; d.data[i+2]+=n;} c.putImageData(d,0,0);}
const RENK={kir:'rgba(58,53,36,A)',mor:'rgba(74,58,82,A)',yesil:'rgba(36,48,41,A)',is:'rgba(5,6,6,A)',acik:'rgba(150,144,116,A)'};
const tekrar=(t,x,y)=>{t.wrapS=t.wrapT=THREE.RepeatWrapping; if(x) t.repeat.set(x,y); return t;};

const duvarDoku=tekrar(tuval(2048,1024,(c,w,h)=>{
  const r=rng(101); let g=c.createLinearGradient(0,0,0,h); g.addColorStop(0,'#2c322c'); g.addColorStop(.55,'#373e36'); g.addColorStop(.56,'#2a2c26'); g.addColorStop(1,'#1e201c');
  c.fillStyle=g; c.fillRect(0,0,w,h);
  for(let i=0;i<90;i++){const k=[RENK.kir,RENK.mor,RENK.yesil,RENK.is][i%4]; leke2(c,r()*w,r()*h,60+r()*300,50+r()*240,k,.12+r()*.22);}
  // dökülen sıva yamaları
  for(let i=0;i<14;i++){const x=r()*w,y=r()*h; c.fillStyle=`rgba(${70+r()*30|0},${68+r()*26|0},${54+r()*20|0},.18)`; c.beginPath(); c.moveTo(x,y); for(let j=0;j<9;j++) c.lineTo(x+Math.cos(j/9*TAU)*(20+r()*70),y+Math.sin(j/9*TAU)*(14+r()*50)); c.closePath(); c.fill(); c.strokeStyle='rgba(8,8,8,.3)'; c.lineWidth=1.5; c.stroke();}
  for(let i=0;i<150;i++){const x=r()*w,y=r()*h*.6,u=60+r()*500; c.strokeStyle=`rgba(6,7,7,${.15+r()*.35})`; c.lineWidth=1+r()*4; c.lineCap='round'; c.beginPath(); c.moveTo(x,y); c.bezierCurveTo(x+(r()-.5)*8,y+u*.3,x+(r()-.5)*12,y+u*.7,x+(r()-.5)*6,y+u); c.stroke();}
  // çatlaklar
  for(let i=0;i<9;i++){let x=r()*w,y=r()*h*.5; c.strokeStyle='rgba(4,4,4,.7)'; c.lineWidth=1.2; c.beginPath(); c.moveTo(x,y); for(let j=0;j<30;j++){x+=(r()-.5)*40; y+=8+r()*22; c.lineTo(x,y);} c.stroke();}
  for(let i=0;i<30;i++){const x=r()*w,y=r()*h; c.strokeStyle=`rgba(150,144,116,${.05+r()*.08})`; c.lineWidth=1; c.beginPath(); c.moveTo(x,y); for(let j=0;j<8;j++) c.quadraticCurveTo(x+(r()-.5)*90,y+(r()-.5)*60,x+(r()-.5)*70,y+(r()-.5)*50); c.stroke();}
  // duvara kazınmış gün çentikleri
  for(let i=0;i<7;i++){const x=640+i*16+r()*4,y=560+r()*8; c.strokeStyle='rgba(160,154,126,.3)'; c.lineWidth=2; c.beginPath(); c.moveTo(x,y); c.lineTo(x+3,y+40+r()*8); c.stroke();}
  c.strokeStyle='rgba(160,154,126,.3)'; c.beginPath(); c.moveTo(630,590); c.lineTo(760,570); c.stroke();
  kumla(c,w,h,r,26);
}));
const zeminDoku=tekrar(tuval(1024,1024,(c,w,h)=>{
  const r=rng(202); c.fillStyle='#22231f'; c.fillRect(0,0,w,h);
  for(let i=0;i<60;i++) leke2(c,r()*w,r()*h,40+r()*200,40+r()*200,[RENK.is,RENK.kir,RENK.yesil][i%3],.2+r()*.3);
  c.strokeStyle='rgba(0,0,0,.6)'; c.lineWidth=3; for(let i=0;i<=4;i++){c.beginPath(); c.moveTo(i*256,0); c.lineTo(i*256,h); c.moveTo(0,i*256); c.lineTo(w,i*256); c.stroke();}
  for(let i=0;i<80;i++){c.strokeStyle=`rgba(0,0,0,${.2+r()*.3})`; c.lineWidth=.6+r()*2; c.beginPath(); const x=r()*w,y=r()*h; c.moveTo(x,y); c.lineTo(x+(r()-.5)*120,y+(r()-.5)*120); c.stroke();}
  kumla(c,w,h,r,20);
}),3,3);
const tahtaDoku=tuval(2048,1024,(c,w,h)=>{
  const r=rng(601); c.fillStyle='#6a523a'; c.fillRect(0,0,w,h);
  for(let p=0;p<7;p++){const y0=p*h/7; c.fillStyle=`rgba(${20+r()*20|0},${14+r()*12|0},8,.35)`; c.fillRect(0,y0,w,h/7);
    for(let i=0;i<140;i++){const y=y0+r()*h/7; c.strokeStyle=r()<.5?`rgba(150,118,80,${.05+r()*.1})`:`rgba(8,5,3,${.15+r()*.3})`; c.lineWidth=.6+r()*2; c.beginPath(); c.moveTo(0,y); for(let x=0;x<w;x+=80) c.lineTo(x,y+(r()-.5)*5); c.stroke();}
    for(let i=0;i<2;i++){const x=r()*w,y=y0+h/14; for(let k=1;k<7;k++){c.strokeStyle=`rgba(10,6,3,${.5-k*.06})`; c.lineWidth=1.5; c.beginPath(); c.ellipse(x,y,k*9,k*3.5,0,0,TAU); c.stroke();}} // budak
    c.strokeStyle='rgba(4,3,2,.95)'; c.lineWidth=5; c.beginPath(); c.moveTo(0,y0); c.lineTo(w,y0+(r()-.5)*6); c.stroke();}
  for(let i=0;i<90;i++){const x=r()*w,y=r()*h,u=10+r()*120,a=(r()-.5)*.6; c.strokeStyle=r()<.5?`rgba(170,140,100,${.08+r()*.14})`:`rgba(2,2,2,${.3+r()*.4})`; c.lineWidth=.8+r()*2; c.beginPath(); c.moveTo(x,y); c.lineTo(x+Math.cos(a)*u,y+Math.sin(a)*u); c.stroke();}
  for(const[x,y,rr]of[[1320,180,60],[1350,200,60],[300,300,52],[900,240,58]]){c.strokeStyle='rgba(6,4,3,.45)'; c.lineWidth=4; c.beginPath(); c.arc(x,y,rr,0,TAU); c.stroke();} // bardak izleri
  for(let i=0;i<8;i++) leke2(c,r()*w,r()*h*.5,30+r()*60,20+r()*40,RENK.is,.4); // sigara yanıkları, lekeler
  kumla(c,w,h,r,18);
});
const kumasDoku=tekrar(tuval(256,256,(c,w,h)=>{
  const r=rng(77); c.fillStyle='#808080'; c.fillRect(0,0,w,h);
  for(let i=-h;i<w;i+=4){c.strokeStyle=`rgba(${r()<.5?40:210},${r()<.5?40:210},${r()<.5?40:210},.35)`; c.lineWidth=1.4; c.beginPath(); c.moveTo(i,0); c.lineTo(i+h,h); c.stroke();}
  for(let y=0;y<h;y+=3){c.strokeStyle=`rgba(0,0,0,${.08+r()*.12})`; c.lineWidth=1; c.beginPath(); c.moveTo(0,y); c.lineTo(w,y); c.stroke();}
  kumla(c,w,h,r,50);
},false),14,14);
const bluzDoku=tekrar(tuval(128,128,(c,w,h)=>{
  const r=rng(78); c.fillStyle='#808080'; c.fillRect(0,0,w,h);
  for(let i=0;i<w;i+=2){c.fillStyle=`rgba(${r()*255|0},${r()*255|0},${r()*255|0},.12)`; c.fillRect(i,0,1,h); c.fillRect(0,i,w,1);}
  kumla(c,w,h,r,30);
},false),20,20);
const sayfaDoku=tuval(512,384,(c,w,h)=>{
  const r=rng(650); c.fillStyle='#9a937c'; c.fillRect(0,0,w,h);
  leke2(c,w*.7,h*.6,200,160,RENK.is,.3); leke2(c,w*.2,h*.2,120,90,RENK.kir,.3);
  c.strokeStyle='rgba(40,50,70,.18)'; c.lineWidth=1; for(let y=30;y<h;y+=24){c.beginPath(); c.moveTo(0,y); c.lineTo(w,y); c.stroke();}
  c.strokeStyle='rgba(8,7,10,.75)'; c.lineCap='round';
  for(let i=0;i<13;i++){const y=28+i*24; c.lineWidth=1.2+r(); c.beginPath(); let x=30; c.moveTo(x,y); while(x<w-40-r()*140){const u=6+r()*14; c.quadraticCurveTo(x+u/2,y-6-r()*8,x+u,y+(r()-.5)*5); x+=u; if(r()<.18){x+=10; c.moveTo(x,y);}} c.stroke();}
  c.lineWidth=2.4; c.beginPath(); c.moveTo(330,160); for(let i=0;i<16;i++) c.quadraticCurveTo(330+(r()-.5)*130,160+(r()-.5)*60,330+(r()-.5)*100,160+(r()-.5)*40); c.stroke();
  c.strokeStyle='rgba(122,31,31,.8)'; c.lineWidth=2.5; c.beginPath(); c.ellipse(150,270,70,18,-.05,0,TAU); c.stroke(); // kırmızı kalemle halka
});
const fotoDoku=tuval(256,180,(c,w,h)=>{
  const r=rng(31); c.fillStyle='#b9b29a'; c.fillRect(0,0,w,h); c.fillStyle='#16150f'; c.fillRect(12,12,w-24,h-24);
  c.save(); c.beginPath(); c.rect(12,12,w-24,h-24); c.clip();
  leke2(c,90,120,90,40,'rgba(90,86,70,A)',.5); leke2(c,180,60,60,60,'rgba(60,70,60,A)',.5);
  c.strokeStyle='rgba(150,144,120,.5)'; c.lineWidth=1.5; for(let i=0;i<8;i++){c.beginPath(); c.moveTo(12,100+i*10); c.lineTo(w-12,92+i*12); c.stroke();} // döşeme tahtaları
  c.fillStyle='rgba(2,2,2,.9)'; c.beginPath(); c.ellipse(120,118,58,16,.1,0,TAU); c.fill(); // yerdeki karaltı
  c.strokeStyle='#a3271f'; c.lineWidth=2.5; c.beginPath(); c.moveTo(170,140); c.bezierCurveTo(190,120,205,150,222,132); c.stroke(); // kırmızı ip
  c.restore(); kumla(c,w,h,r,30);
});
const saatDoku=tuval(256,256,(c,w,h)=>{
  c.fillStyle='#8f8a74'; c.beginPath(); c.arc(128,128,126,0,TAU); c.fill(); leke2(c,150,160,120,120,RENK.kir,.5);
  c.strokeStyle='#0c0b0a'; c.lineCap='round';
  for(let i=0;i<60;i++){const a=i/60*TAU, b=i%5===0; c.lineWidth=b?5:1.5; c.beginPath(); c.moveTo(128+Math.sin(a)*(b?96:106),128-Math.cos(a)*(b?96:106)); c.lineTo(128+Math.sin(a)*114,128-Math.cos(a)*114); c.stroke();}
  const el=(a,u,k)=>{c.lineWidth=k; c.beginPath(); c.moveTo(128,128); c.lineTo(128+Math.sin(a)*u,128-Math.cos(a)*u); c.stroke();};
  el((10+40/60)/12*TAU,58,8); el(40/60*TAU,92,5); // 22:40'ta durmuş
  c.fillStyle='#0c0b0a'; c.beginPath(); c.arc(128,128,7,0,TAU); c.fill();
  c.strokeStyle='rgba(8,8,8,.6)'; c.lineWidth=1.2; c.beginPath(); c.moveTo(60,40); c.lineTo(110,120); c.lineTo(96,190); c.moveTo(110,120); c.lineTo(170,150); c.stroke(); // çatlak cam
});
const irisDoku=tuval(256,256,(c,w,h)=>{
  const r=rng(5); let g=c.createRadialGradient(128,128,10,128,128,126); g.addColorStop(0,'#3d4a36'); g.addColorStop(.45,'#66755e'); g.addColorStop(.7,'#3c4638'); g.addColorStop(.84,'#0c0f0c'); g.addColorStop(1,'#030404');
  c.fillStyle=g; c.beginPath(); c.arc(128,128,127,0,TAU); c.fill();
  for(let i=0;i<260;i++){const a=r()*TAU, r0=30+r()*20, r1=80+r()*40; c.strokeStyle=r()<.5?`rgba(210,216,196,${.1+r()*.25})`:`rgba(30,40,32,${.15+r()*.3})`; c.lineWidth=.6+r()*1.6; c.beginPath(); c.moveTo(128+Math.cos(a)*r0,128+Math.sin(a)*r0); c.lineTo(128+Math.cos(a+(r()-.5)*.1)*r1,128+Math.sin(a+(r()-.5)*.1)*r1); c.stroke();}
  g=c.createRadialGradient(128,128,40,128,128,64); g.addColorStop(0,'rgba(150,120,60,.35)'); g.addColorStop(1,'rgba(150,120,60,0)'); c.fillStyle=g; c.fillRect(0,0,w,h); // gözbebeği çevresinde sarımsı halka
  c.fillStyle='#020202'; c.beginPath(); c.arc(128,128,46,0,TAU); c.fill(); // gözbebeği
});
const akDoku=tuval(512,256,(c,w,h)=>{
  const r=rng(6); c.fillStyle='#7d786a'; c.fillRect(0,0,w,h);
  leke2(c,128,128,130,130,'rgba(176,172,158,A)',.7); // ön yüz daha açık
  for(let i=0;i<70;i++){let x=128+(r()-.5)*260, y=128+(r()-.5)*200; c.strokeStyle=`rgba(120,40,40,${.12+r()*.25})`; c.lineWidth=.6+r(); c.beginPath(); c.moveTo(x,y); for(let j=0;j<6;j++){x+=(128-x)*.12+(r()-.5)*12; y+=(128-y)*.12+(r()-.5)*12; c.lineTo(x,y);} c.stroke();} // kılcal damarlar
});
const dumanDoku=(()=>{const k=document.createElement('canvas'); k.width=k.height=128; const c=k.getContext('2d'); const g=c.createRadialGradient(64,64,0,64,64,64); g.addColorStop(0,'rgba(180,178,160,.5)'); g.addColorStop(.5,'rgba(150,148,132,.18)'); g.addColorStop(1,'rgba(150,148,132,0)'); c.fillStyle=g; c.fillRect(0,0,128,128); return new THREE.CanvasTexture(k);})();

const mat=(renk,o={})=>new THREE.MeshStandardMaterial({color:renk,roughness:.92,metalness:0,...o});
const ekle=(m,{golgeAt=true,golgeAl=true}={})=>{m.castShadow=golgeAt; m.receiveShadow=golgeAl; return m;};
const kutu=(w,h,d,m,x,y,z,ana=sahne)=>{const k=ekle(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m)); k.position.set(x,y,z); ana.add(k); return k;};
function birlestir(liste){ // çok sayıda küçük geometriyi tek çizime indirir; her birine ayrı renk verilebilir
  let nv=0,ni=0; for(const[g]of liste){nv+=g.attributes.position.count; ni+=g.index.count;}
  const pos=new Float32Array(nv*3), nor=new Float32Array(nv*3), col=new Float32Array(nv*3), idx=new Uint32Array(ni); let ov=0,oi=0;
  for(const[g,k]of liste){
    pos.set(g.attributes.position.array,ov*3); nor.set(g.attributes.normal.array,ov*3);
    for(let i=0;i<g.attributes.position.count;i++){col[(ov+i)*3]=k.r; col[(ov+i)*3+1]=k.g; col[(ov+i)*3+2]=k.b;}
    for(let i=0;i<g.index.count;i++) idx[oi+i]=g.index.array[i]+ov;
    ov+=g.attributes.position.count; oi+=g.index.count; g.dispose();
  }
  const b=new THREE.BufferGeometry(); b.setAttribute('position',new THREE.BufferAttribute(pos,3)); b.setAttribute('normal',new THREE.BufferAttribute(nor,3)); b.setAttribute('color',new THREE.BufferAttribute(col,3)); b.setIndex(new THREE.BufferAttribute(idx,1)); return b;
}

/* ───────────── oda ───────────── */
const ODA={sol:-2.2,sag:2.2,arka:-1.7,on:2.4,tavan:2.7};
{
  const duvarMat=mat('#ffffff',{map:duvarDoku,bumpMap:duvarDoku,bumpScale:3});
  const arka=ekle(new THREE.Mesh(new THREE.PlaneGeometry(4.4,2.7),duvarMat)); arka.position.set(0,1.35,ODA.arka); sahne.add(arka);
  for(const s of[-1,1]){
    const d=duvarMat.clone(); d.map=d.bumpMap=duvarDoku.clone(); d.map.offset.x=s>0?.5:.2; d.map.needsUpdate=true;
    const m=ekle(new THREE.Mesh(new THREE.PlaneGeometry(4.1,2.7),d)); m.rotation.y=-s*Math.PI/2; m.position.set(s*2.2,1.35,.35); sahne.add(m);
  }

function yuzGeometrisi(){

    nokta(s*.36,.3,.04,.09);        // kaş kemiği

    nokta(s*.088,-.262,.034,.04);   // burun kanadı
    nokta(s*.055,-.31,-.035,.024);  // burun deliği
    nokta(s*.275,-.488,-.012,.03);  // ağız köşesi
    cizgi(s*.12,-.27,s*.3,-.5,-.012,.025);            // burun-dudak kıvrımı
    cizgi(s*.035,-.34,s*.04,-.425,.004,.014);          // filtrum kenarı
    cizgi(s*.24,-.045,s*.46,-.035,.012,.022);          // göz altı torbası
    cizgi(0,-.446,s*.12,-.452,.015,.02); cizgi(s*.12,-.452,s*.24,-.474,.008,.018); // üst dudak
    cizgi(s*.5,-.72,s*.3,-.9,.02,.06);                 // çene kemiği hattı
  }
  nokta(0,.26,.018,.1); nokta(0,-.215,.062,.055); nokta(0,-.335,-.022,.045); nokta(0,-.46,.028,.17); nokta(0,-.432,-.007,.02); nokta(0,-.77,.065,.1);
  cizgi(0,-.34,0,-.425,-.005,.012);                    // filtrum oluğu
  cizgi(-.26,-.479,.26,-.479,-.02,.011);                // ağız çizgisi
  cizgi(-.13,-.522,.13,-.522,.022,.03);                  // alt dudak
  cizgi(-.1,-.61,.1,-.61,-.028,.04);                   // dudak altı çukuru

    if(v.y<0) v.x*=1-.33*Math.pow(-v.y,1.5)*(v.z>0?1:.75); // çene daralır

function omuzaYatir(P,on){const r=ceketR(P.y); if(!r||Math.abs(P.x)>=r) return; const zz=.62*Math.sqrt(r*r-P.x*P.x)*1.05+.04; if(on>0?P.z<zz:P.z>-zz) P.z=on*zz;}

    cMurekkep:{value:new THREE.Color(PAL.murekkep)},cDerin:{value:new THREE.Color('#0e0d12')},cMor:{value:new THREE.Color('#2e2534')},cYesil:{value:new THREE.Color('#3b4a40')},cSari:{value:new THREE.Color('#d6c08a')}},
  vertexShader:`varying vec2 vUv; void main(){vUv=uv; gl_Position=vec4(position.xy,0.,1.);}`,
  fragmentShader:`
  precision highp float;
  uniform sampler2D tRenk,tDerin; uniform vec2 coz; uniform float dpr,kaynama,zaman,yakin,uzak;
  uniform vec3 cMurekkep,cDerin,cMor,cYesil,cSari; varying vec2 vUv;
  float h(vec2 p){p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y);}
  float gurultu(vec2 p){vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f); return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
  float fbm(vec2 p){float a=.5,s=0.; for(int i=0;i<4;i++){s+=a*gurultu(p); p*=2.03; a*=.5;} return s;}
  float derin(vec2 uv){float z=texture2D(tDerin,uv).x*2.-1.; return 2.*yakin*uzak/(uzak+yakin-z*(uzak-yakin));}
  vec3 ton(vec3 c){c*=1.15; c=clamp((c*(2.51*c+.03))/(c*(2.43*c+.59)+.14),0.,1.); return pow(c,vec3(1./2.2));}
  vec3 renk(vec2 uv){return ton(texture2D(tRenk,uv).rgb);}
  float lum(vec3 c){return dot(c,vec3(.299,.587,.114));}
  // tarama: kırık, titrek paralel çizgiler; yalnızca karanlıkta
  float tarama(vec2 p,float aci,float aralik,float esik,float L){
    vec2 d=vec2(cos(aci),sin(aci)); float u=dot(p,d), v=dot(p,vec2(-d.y,d.x));
    v+=(gurultu(vec2(u*.04,v*.1)+kaynama*1.7)-.5)*2.2;
    float sira=floor(v/aralik), f=abs(fract(v/aralik)-.5)*2.;
    float kirik=step(.36,gurultu(vec2(u*.025+sira*7.3,sira*1.9)+kaynama*.37));
    float koyu=clamp((esik-L)/esik,0.,1.);
    return (1.-smoothstep(.04+koyu*.2,.2+koyu*.3,f))*kirik*smoothstep(0.,.35,koyu);
  }
  void main(){
    vec2 px=1./coz;
    // hatlar saniyede 7 kez hafifçe kayar (kaynama)
    vec2 kay=(vec2(gurultu(vUv*9.+kaynama*13.1),gurultu(vUv*9.+kaynama*7.7+3.))-.5)*px*2.2*dpr;
    vec2 uv=vUv+kay;
    // ışıma: çok parlak yerler çevresine taşar
    vec3 ham=texture2D(tRenk,uv).rgb, isi=vec3(0.);
    float da=h(gl_FragCoord.xy*.37)*6.2832;
    for(int i=0;i<14;i++){float a=float(i)*2.39996+da, r=sqrt((float(i)+.5)/14.)*34.*dpr; isi+=min(max(texture2D(tRenk,uv+vec2(cos(a),sin(a))*r*px).rgb-1.5,0.),vec3(6.));}
    vec3 c=ton(ham+isi/14.*.35); float L=lum(c);
    // mürekkep hattı: derinlik ve parlaklık kenarı
    float d0=derin(uv); vec2 o=px*1.1*dpr;
    float dx=derin(uv+vec2(o.x,0))-derin(uv-vec2(o.x,0)), dy=derin(uv+vec2(0,o.y))-derin(uv-vec2(0,o.y));
    float kd=length(vec2(dx,dy))/d0;
    float lx=lum(renk(uv+vec2(o.x,0)))-lum(renk(uv-vec2(o.x,0))), ly=lum(renk(uv+vec2(0,o.y)))-lum(renk(uv-vec2(0,o.y)));
    float hat=max(smoothstep(.035,.1,kd),smoothstep(.14,.3,length(vec2(lx,ly)))*.5);
    hat*=(.55+.45*gurultu(gl_FragCoord.xy/dpr*.08+kaynama*3.1))*(1.-smoothstep(.75,.95,L));
    // renk: morluk moru karanlık, küflü yeşil orta, kirli sarı ışık
    vec3 g=mix(cDerin,cMor,smoothstep(.0,.12,L)); g=mix(g,cYesil,smoothstep(.1,.32,L)); g=mix(g,cSari,smoothstep(.35,.85,L));
    c=mix(c,g*(.6+L*.8),.3);
    // çamurlu boya lekeleri
    float lk=fbm(vUv*vec2(3.,2.2)+vec2(1.7,4.1));
    c*=.84+.3*lk; c=mix(c,cMor*.6,smoothstep(.62,.9,fbm(vUv*2.1+9.))*.2);
    // tarama
    vec2 p=gl_FragCoord.xy/dpr;
    float t1=tarama(p,.7,6.,.17,L), t2=tarama(p,-1.05,7.,.09,L)*.85, t3=tarama(p,.2,5.,.04,L)*.7;
    float tr=max(max(t1,t2),t3)*.6;
    c=mix(c,cMurekkep,clamp(max(hat*.7,tr),0.,1.));
    // kararma, film çizikleri, kum
    vec2 q=vUv-vec2(.48,.56); c*=1.-smoothstep(.3,.9,length(q*vec2(1.2,1.1)))*.8;
    float zt=floor(zaman*11.);
    for(int i=0;i<2;i++){float x=h(vec2(zt,float(i)*3.1)); if(h(vec2(zt*1.3,float(i)))>.5) c+=vec3(.06,.058,.05)*(1.-smoothstep(0.,1.5*px.x,abs(vUv.x-x)))*step(h(vec2(zt,7.)),vUv.y+.4);}
    c+=(h(gl_FragCoord.xy+fract(zaman*12.)*97.)-.5)*.06;
    gl_FragColor=vec4(c,1.);
  }`,
  depthTest:false,depthWrite:false
});
const sonSahne=new THREE.Scene(), sonKam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
sonSahne.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),sonIslem));

let vw=0,vh=0;
function boyutla(){
  vw=cv.clientWidth; vh=cv.clientHeight; if(vw<8||vh<8) return;
  const dpr=Math.min(devicePixelRatio||1,2);
  ren.setPixelRatio(dpr); ren.setSize(vw,vh,false);
  const w=Math.round(vw*dpr), h=Math.round(vh*dpr);
  hedef.setSize(w,h); sonIslem.uniforms.coz.value.set(w,h); sonIslem.uniforms.dpr.value=dpr;
  kam.aspect=vw/vh;
  // dar ekranda (telefon dikey) yüz kadrajda kalsın diye görüş açısı genişler
  kam.fov=kam.aspect<1?lerp(62,42,clamp(kam.aspect,0,1)):42;
  kam.updateProjectionMatrix();
}
addEventListener('resize',boyutla); boyutla();

/* ───────────── canlılık ───────────── */
const durum={imX:0,imY:0,imZaman:-99,hedefX:0,hedefY:0,sonrakiBakis:2,kirpBas:-9,sonrakiKirp:3,cift:false,kesinti:-9,sonrakiKesinti:4};
function isaretci(e){durum.imX=clamp((e.clientX-vw/2)/(vw*.5),-1,1); durum.imY=clamp((e.clientY-vh*.4)/(vh*.5),-1,1); durum.imZaman=performance.now()/1000;}
addEventListener('pointermove',isaretci,{passive:true}); addEventListener('pointerdown',isaretci,{passive:true});
const altyazi=document.getElementById('altyazi'), dugme=document.getElementById('konustur');
const soz={cizelge:null,bas:0,metin:''};
function cizelgeKur(metin){
  const adimlar=[], K=KONUSMA; let z=0;
  [...metin].forEach((hf,i)=>{
    const k=hf.toLocaleLowerCase('tr'); let ac,sure;
    if(/\s/.test(k)){ac=0; sure=K.sure.bosluk;} else if(/[.,;:?!…]/.test(k)){ac=0; sure=K.sure.nokta;}
    else if(k in K.harf){ac=K.harf[k]; sure=ac?K.sure.unlu:K.sure.dudak;} else{ac=K.unsuz; sure=K.sure.unsuz;}
    adimlar.push({bas:z,ac,harf:i+1}); z+=sure;
  });
  return {adimlar,bitis:z};
}
function konus(metin){soz.metin=metin; soz.cizelge=cizelgeKur(metin); soz.bas=performance.now(); altyazi.textContent=''; dugme.classList.add('soluk'); dugme.textContent='Tekrar konuştur';}
document.getElementById('kutu').addEventListener('click',()=>konus(KONUSMA.cumle));
function sozGuncelle(dt){
  let ac=0;
  if(soz.cizelge){
    const g=performance.now()-soz.bas, C=soz.cizelge; let harf=0;
    for(const a of C.adimlar){if(a.bas<=g){ac=a.ac; harf=a.harf;} else break;}
    if(g>=C.bitis){ac=0; harf=[...soz.metin].length; soz.cizelge=null; dugme.classList.remove('soluk');}
    const goster=[...soz.metin].slice(0,harf).join(''); if(altyazi.textContent!==goster) altyazi.textContent=goster;
  }
  poz.agizAc+=(ac-poz.agizAc)*(1-Math.exp(-dt*24));
}
const YUKARI=new V3(0,1,0);
function guncelle(t,dt){
  const R=Math.random;
  sozGuncelle(dt);
  if(t-durum.imZaman<2.5){durum.hedefX=durum.imX; durum.hedefY=durum.imY;}
  else if(t>durum.sonrakiBakis){
    if(R()<.82){durum.hedefX=0; durum.hedefY=0; durum.sonrakiBakis=t+3+R()*5;}
    else{durum.hedefX=(R()-.5)*.8; durum.hedefY=(R()-.4)*.4; durum.sonrakiBakis=t+.35+R()*.6;}
  }
  const hiz=1-Math.exp(-dt*16), agir=1-Math.exp(-dt*2.6);
  poz.gx+=(durum.hedefX-poz.gx)*hiz; poz.gy+=(durum.hedefY-poz.gy)*hiz;
  poz.hgx+=(durum.hedefX-poz.hgx)*agir; poz.hgy+=(durum.hedefY-poz.hgy)*agir;
  if(t>durum.sonrakiKirp){durum.kirpBas=t; durum.cift=R()<.12; durum.sonrakiKirp=t+4+R()*6;}
  let p=(t-durum.kirpBas)/.18, kapali=0;
  if(p>=0&&p<=1) kapali=Math.sin(p*Math.PI); else if(durum.cift){p=(t-durum.kirpBas-.27)/.18; if(p>=0&&p<=1) kapali=Math.sin(p*Math.PI);}
  poz.goz=.74*(1-kapali)-poz.gy*.06;
  if(t>durum.sonrakiKesinti){durum.kesinti=t; durum.sonrakiKesinti=t+3+R()*9;}
  let I=.94+.05*Math.sin(t*9.1)*Math.sin(t*2.3)+.02*Math.sin(t*31);
  const ks=t-durum.kesinti; if(ks>=0&&ks<.34) I*=(Math.sin(ks*70)>.1?.3:1);
  poz.isik=azHareket?1:I;
  poz.kam+=(durum.imX-poz.kam)*(1-Math.exp(-dt*3.2)); poz.kamY+=(durum.imY-poz.kamY)*(1-Math.exp(-dt*3.2));
  poz.nefes=azHareket?0:Math.sin(t*.95)*.5+.5;

  // ampul: sarkaç
  const ax=azHareket?0:Math.sin(t*.8)*.06+Math.sin(t*1.9)*.012, az=azHareket?0:Math.sin(t*.63+1)*.035;
  const b=new V3(Math.sin(ax)*AMPUL.boy,-Math.cos(ax)*Math.cos(az)*AMPUL.boy,Math.sin(az)*AMPUL.boy).add(AMPUL.asma);
  const yon=new V3().subVectors(AMPUL.asma,b).normalize();
  ampulG.position.copy(b); ampulG.quaternion.setFromUnitVectors(YUKARI,yon);
  ampulHale.position.copy(b); ampulSis.position.copy(b); isik.position.copy(b).y-=.02;
  kablo.position.copy(b).add(AMPUL.asma).multiplyScalar(.5); kablo.scale.y=AMPUL.boy-.06; kablo.quaternion.copy(ampulG.quaternion);
  isik.intensity=12.5*poz.isik; sekme.intensity=.5*poz.isik;
  ampulCam.material.color.setRGB(9,7.6,5).multiplyScalar(.15+.85*poz.isik); ampulHale.material.opacity=ampulHale.userData.op*poz.isik; ampulSis.material.opacity=ampulSis.userData.op*poz.isik;

  // karakter: baş bakışı ağır izler, gözler hızlı; nefes; konuşma
  kafaG.rotation.set(poz.hgy*.08+.03,poz.hgx*.16,-poz.hgx*.03);
  for(const g of gozler) g.rotation.set(poz.gy*.28,poz.gx*.42,0);
  for(const k of kapaklar) k.rotation.x=lerp(.5,-.34,clamp(poz.goz,0,1)/.74*.86);
  govde.position.y=poz.nefes*.03; govde.scale.set(1+poz.nefes*.006,1,1+poz.nefes*.012);
  yuz.morphTargetInfluences[0]=poz.agizAc;

  // duman, toz, makaralar
  for(const s of duman){
    const f=(s.userData.faz+t*.07)%1, y=f*.6;
    s.position.set(duman.kok.x+Math.sin(y*6+t*1.1+s.userData.yon)*(.008+f*.07)+f*.05,duman.kok.y+y,duman.kok.z+Math.cos(y*5+t*.9+s.userData.yon)*f*.05);
    const o=.025+f*.24; s.scale.set(o,o,1); s.material.opacity=(azHareket?0:1)*Math.sin(f*Math.PI)*.4*(1-f*.4);
  }
  for(let i=0;i<TOZ;i++){const d=tozVeri[i], z=azHareket?0:t*.12*d[4]; tozKonum[i*3]=d[0]+Math.sin(z+d[3])*.12; tozKonum[i*3+1]=d[1]+Math.sin(z*.7+d[3]*2)*.1; tozKonum[i*3+2]=d[2]+Math.cos(z*.9+d[3])*.12;}
  tozG.attributes.position.needsUpdate=true; toz.material.opacity=.5*poz.isik;
  if(!azHareket){for(const m of makaralar) m.rotation.y=-t*.9; duman.kayit.userData.led.visible=Math.sin(t*2.2)>-.6;}

  // kamera: imleçle hafifçe kayar, yüze bakar
  kam.position.set(poz.kam*.14,OLCU.kameraY-poz.kamY*.04,OLCU.kameraZ);
  kam.lookAt(poz.kam*.03,OLCU.kafaY+OLCU.bakY,-.05);
  sonIslem.uniforms.kaynama.value=azHareket?0:Math.floor(t*OLCU.kaynamaHizi)%64;
  sonIslem.uniforms.zaman.value=azHareket?0:t;
}

let onceki=performance.now();
function kare(now){
  requestAnimationFrame(kare);
  if(vw<8||vh<8){boyutla(); return;}
  const dt=Math.min(.05,(now-onceki)/1000); onceki=now;
  guncelle(now/1000,dt);
  ren.setRenderTarget(hedef); ren.render(sahne,kam);
  ren.setRenderTarget(null); ren.render(sonSahne,sonKam);
}
requestAnimationFrame(kare);
window.sorgu3b={poz,PAL,OLCU,KONUSMA,konus,sahne,kam};
</script>
