<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorgu Odası 3B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--zemin:#070808;--lamba:#e2c27a;--kagit:#8f8a74;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--zemin);overflow:hidden}
.kutu{position:relative;width:100%;height:100%;cursor:pointer;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%;touch-action:manipulation}
.alt{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:40px 16px 14px;background:linear-gradient(to top,rgba(3,4,4,.7) 20%,rgba(3,4,4,0));pointer-events:none}
.altyazi{min-height:1.3em;margin:0;font:700 clamp(22px,5.2vw,34px)/1.3 "Courier Prime","Courier New",ui-monospace,monospace;
  color:#d9d2ba;letter-spacing:.03em;text-align:center;text-wrap:balance;text-shadow:0 2px 12px #000}
.konustur{pointer-events:auto;font:400 15px/1 "Courier Prime","Courier New",ui-monospace,monospace;color:#8f8a74;background:transparent;
  border:1px solid rgba(143,138,116,.4);border-radius:2px;padding:9px 14px;cursor:pointer;transition:opacity .4s}
.konustur:hover{color:#d9d2ba;border-color:#d9d2ba}
.konustur:focus-visible{outline:2px solid var(--lamba);outline-offset:3px}
.konustur.soluk{opacity:.4}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div class="kutu" id="kutu">
  <canvas id="sahne" aria-label="Loş sorgu odasında, sallanan ampulün altında masanın karşısında oturup bize bakan kadın"></canvas>
  <div class="alt">
    <p class="altyazi" id="altyazi" aria-live="polite"></p>
    <button class="konustur" id="konustur" type="button">Konuşması için dokunun</button>
  </div>
</div>
<script type="module">
import * as THREE from 'three';

/* ───────────── yardımcılar ───────────── */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const azHareket=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ───────────── tek yerden ayar ───────────── */
const PAL={
  tenIsik:'#bdb69e', ten:'#948e7b', tenOrta:'#6d685c', tenGolge:'#33303a', tenDerin:'#0e0d12',
  morluk:'#4a3a52', dudak:'#4c2a31', dudakGolge:'#2a141a', sac:'#0b0a0c', sacIsik:'#4a4338',
  iris:'#a9b3a0', murekkep:'#08070a', lamba:'#e2c27a', soguk:'#5c7479', kagit:'#8f8a74',
  ceket:'#1c2420', bluz:'#6a6555', tahta:'#241b13'
};
const OLCU={kafaY:1.27, kafaOlcek:.115, masaY:.78, kaynamaHizi:7, kameraZ:1.6, kameraY:1.5};
const poz={gx:0,gy:0,hgx:0,hgy:0,goz:.74,agizAc:0,nefes:0,isik:1,kam:0,kamY:0};
const KONUSMA={
  cumle:'O gece değirmende değildim.',
  harf:{a:.55,e:.5,'ı':.2,i:.2,o:.65,'ö':.6,u:.35,'ü':.35,m:0,b:0,p:0}, unsuz:.18,
  sure:{unlu:130,unsuz:72,dudak:88,bosluk:90,nokta:240}
};

/* ───────────── görünüm ───────────── */
const cv=document.getElementById('sahne');
const ren=new THREE.WebGLRenderer({canvas:cv,antialias:false,powerPreference:'high-performance'});
ren.shadowMap.enabled=true; ren.shadowMap.type=THREE.PCFSoftShadowMap;
const sahne=new THREE.Scene();
sahne.background=new THREE.Color('#050606');
sahne.fog=new THREE.FogExp2('#070908',.16);
const kam=new THREE.PerspectiveCamera(34,1,.05,20);

/* ───────────── kodla çizilen dokular: leke, akıntı, kazıntı ───────────── */
function tuval(w,h,fn){const k=document.createElement('canvas'); k.width=w; k.height=h; fn(k.getContext('2d'),w,h); const t=new THREE.CanvasTexture(k); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4; return t;}
function leke2(c,x,y,rx,ry,renk,a){c.save(); c.translate(x,y); c.scale(rx,ry); const g=c.createRadialGradient(0,0,0,0,0,1); g.addColorStop(0,renk.replace('A',a)); g.addColorStop(.5,renk.replace('A',a*.55)); g.addColorStop(1,renk.replace('A',0)); c.fillStyle=g; c.beginPath(); c.arc(0,0,1,0,TAU); c.fill(); c.restore();}
const RENK={kir:'rgba(58,53,36,A)',mor:'rgba(74,58,82,A)',yesil:'rgba(36,48,41,A)',is:'rgba(5,6,6,A)',acik:'rgba(138,132,104,A)'};
const duvarDoku=tuval(2048,1024,(c,w,h)=>{
  const r=rng(101); let g=c.createLinearGradient(0,0,0,h); g.addColorStop(0,'#2a2f2a'); g.addColorStop(.5,'#333a33'); g.addColorStop(1,'#1c1f1c');
  c.fillStyle=g; c.fillRect(0,0,w,h);
  for(let i=0;i<70;i++){const k=[RENK.kir,RENK.mor,RENK.yesil,RENK.is][i%4]; leke2(c,r()*w,r()*h,60+r()*300,50+r()*240,k,.12+r()*.22);}
  for(let i=0;i<120;i++){const x=r()*w,y=r()*h*.6,u=60+r()*500; c.strokeStyle=`rgba(6,7,7,${.15+r()*.35})`; c.lineWidth=1+r()*4; c.lineCap='round'; c.beginPath(); c.moveTo(x,y); c.bezierCurveTo(x+(r()-.5)*8,y+u*.3,x+(r()-.5)*12,y+u*.7,x+(r()-.5)*6,y+u); c.stroke();}
  for(let i=0;i<30;i++){const x=r()*w,y=r()*h; c.strokeStyle=`rgba(150,144,116,${.05+r()*.08})`; c.lineWidth=1; c.beginPath(); c.moveTo(x,y); for(let j=0;j<8;j++) c.quadraticCurveTo(x+(r()-.5)*90,y+(r()-.5)*60,x+(r()-.5)*70,y+(r()-.5)*50); c.stroke();}
  for(let i=0;i<7;i++){const x=640+i*16+r()*4,y=560+r()*8; c.strokeStyle='rgba(150,144,116,.22)'; c.lineWidth=2; c.beginPath(); c.moveTo(x,y); c.lineTo(x+3,y+40+r()*8); c.stroke();}
  c.strokeStyle='rgba(150,144,116,.22)'; c.beginPath(); c.moveTo(630,590); c.lineTo(760,570); c.stroke();
  const d=c.getImageData(0,0,w,h); for(let i=0;i<d.data.length;i+=4){const n=(r()-.5)*22; d.data[i]+=n; d.data[i+1]+=n; d.data[i+2]+=n;} c.putImageData(d,0,0);
});
duvarDoku.wrapS=duvarDoku.wrapT=THREE.RepeatWrapping;
const zeminDoku=tuval(1024,1024,(c,w,h)=>{
  const r=rng(202); c.fillStyle='#1d1e1b'; c.fillRect(0,0,w,h);
  for(let i=0;i<60;i++) leke2(c,r()*w,r()*h,40+r()*200,40+r()*200,[RENK.is,RENK.kir,RENK.yesil][i%3],.2+r()*.3);
  for(let i=0;i<80;i++){c.strokeStyle=`rgba(0,0,0,${.2+r()*.3})`; c.lineWidth=.6+r()*2; c.beginPath(); const x=r()*w,y=r()*h; c.moveTo(x,y); c.lineTo(x+(r()-.5)*120,y+(r()-.5)*120); c.stroke();}
});
zeminDoku.wrapS=zeminDoku.wrapT=THREE.RepeatWrapping; zeminDoku.repeat.set(3,3);
const tahtaDoku=tuval(2048,1024,(c,w,h)=>{
  const r=rng(601); c.fillStyle='#6a523a'; c.fillRect(0,0,w,h);
  for(let p=0;p<7;p++){const y0=p*h/7; c.fillStyle=`rgba(${20+r()*20|0},${14+r()*12|0},8,.35)`; c.fillRect(0,y0,w,h/7);
    for(let i=0;i<90;i++){const y=y0+r()*h/7; c.strokeStyle=r()<.5?`rgba(150,118,80,${.05+r()*.1})`:`rgba(8,5,3,${.15+r()*.3})`; c.lineWidth=.6+r()*2; c.beginPath(); c.moveTo(0,y); for(let x=0;x<w;x+=80) c.lineTo(x,y+(r()-.5)*5); c.stroke();}
    c.strokeStyle='rgba(4,3,2,.9)'; c.lineWidth=5; c.beginPath(); c.moveTo(0,y0); c.lineTo(w,y0+(r()-.5)*6); c.stroke();}
  for(let i=0;i<70;i++){const x=r()*w,y=r()*h,u=10+r()*120,a=(r()-.5)*.6; c.strokeStyle=r()<.5?`rgba(170,140,100,${.08+r()*.14})`:`rgba(2,2,2,${.3+r()*.4})`; c.lineWidth=.8+r()*2; c.beginPath(); c.moveTo(x,y); c.lineTo(x+Math.cos(a)*u,y+Math.sin(a)*u); c.stroke();}
  for(const[x,y,rr]of[[1500,300,60],[1530,320,60],[300,700,52]]){c.strokeStyle='rgba(6,4,3,.5)'; c.lineWidth=4; c.beginPath(); c.arc(x,y,rr,0,TAU); c.stroke();}
});
const sayfaDoku=tuval(512,384,(c,w,h)=>{
  const r=rng(650); c.fillStyle='#8a8470'; c.fillRect(0,0,w,h);
  leke2(c,w*.7,h*.6,200,160,RENK.is,.35); leke2(c,w*.2,h*.2,120,90,RENK.kir,.3);
  c.strokeStyle='rgba(8,7,10,.7)'; c.lineCap='round';
  for(let i=0;i<11;i++){const y=40+i*30; c.lineWidth=1.4+r(); c.beginPath(); c.moveTo(30,y); for(let x=40;x<w-40-r()*120;x+=10+r()*14) c.lineTo(x,y+(r()-.5)*7); c.stroke();}
  c.lineWidth=2.4; c.beginPath(); c.moveTo(300,150); for(let i=0;i<14;i++) c.quadraticCurveTo(300+(r()-.5)*120,150+(r()-.5)*70,300+(r()-.5)*90,150+(r()-.5)*50); c.stroke();
});
const dumanDoku=(()=>{const k=document.createElement('canvas'); k.width=k.height=128; const c=k.getContext('2d'); const g=c.createRadialGradient(64,64,0,64,64,64); g.addColorStop(0,'rgba(180,178,160,.5)'); g.addColorStop(.5,'rgba(150,148,132,.18)'); g.addColorStop(1,'rgba(150,148,132,0)'); c.fillStyle=g; c.fillRect(0,0,128,128); return new THREE.CanvasTexture(k);})();

const mat=(renk,o={})=>new THREE.MeshStandardMaterial({color:renk,roughness:.92,metalness:0,...o});
const ekle=(m,{golgeAt=true,golgeAl=true}={})=>{m.castShadow=golgeAt; m.receiveShadow=golgeAl; return m;};

/* ───────────── oda ───────────── */
const ODA={sol:-2.2,sag:2.2,arka:-1.7,on:2.4,tavan:2.7};
{
  const duvarMat=mat('#ffffff',{map:duvarDoku});
  const arka=ekle(new THREE.Mesh(new THREE.PlaneGeometry(4.4,2.7),duvarMat)); arka.position.set(0,1.35,ODA.arka); sahne.add(arka);
  for(const s of[-1,1]){
    const d=duvarMat.clone(); d.map=duvarDoku.clone(); d.map.offset.x=s>0?.5:.2; d.map.needsUpdate=true;
    const m=ekle(new THREE.Mesh(new THREE.PlaneGeometry(4.1,2.7),d)); m.rotation.y=-s*Math.PI/2; m.position.set(s*2.2,1.35,.35); sahne.add(m);
  }
  const zemin=ekle(new THREE.Mesh(new THREE.PlaneGeometry(4.4,4.1),mat('#ffffff',{map:zeminDoku}))); zemin.rotation.x=-Math.PI/2; zemin.position.set(0,0,.35); sahne.add(zemin);
  const tavan=ekle(new THREE.Mesh(new THREE.PlaneGeometry(4.4,4.1),mat('#141614'))); tavan.rotation.x=Math.PI/2; tavan.position.set(0,ODA.tavan,.35); sahne.add(tavan);
  // borular: duvarın üstünden gelip aşağı iner
  const boruMat=mat('#3a3a30',{roughness:.6,metalness:.4});
  const boru=(a,b,r)=>{const v=new THREE.Vector3().subVectors(b,a); const m=ekle(new THREE.Mesh(new THREE.CylinderGeometry(r,r,v.length(),12),boruMat)); m.position.copy(a).addScaledVector(v,.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),v.clone().normalize()); sahne.add(m);};
  boru(new THREE.Vector3(-2.2,2.32,-1.62),new THREE.Vector3(-1.32,2.32,-1.62),.035); boru(new THREE.Vector3(-1.32,2.32,-1.62),new THREE.Vector3(-1.32,0,-1.62),.035);
  boru(new THREE.Vector3(-2.2,2.18,-1.58),new THREE.Vector3(-1.46,2.18,-1.58),.025); boru(new THREE.Vector3(-1.46,2.18,-1.58),new THREE.Vector3(-1.46,0,-1.58),.025);
  // duvarda boş çerçeve
  const cerMat=mat('#2c271d');
  for(const[x,y,w,h]of[[-.95,1.95,.5,.03],[-.95,1.45,.5,.03],[-1.19,1.7,.03,.5],[-.71,1.7,.03,.5]]){const m=ekle(new THREE.Mesh(new THREE.BoxGeometry(w,h,.03),cerMat)); m.position.set(x,y,ODA.arka+.02); sahne.add(m);}
  const cerIc=new THREE.Mesh(new THREE.PlaneGeometry(.45,.45),mat('#0b0c0b')); cerIc.position.set(-.95,1.7,ODA.arka+.012); sahne.add(cerIc);
  // aralık kapı: arkasından soğuk, soluk ışık sızar
  const kx=1.15, kg=.9, kh=2.05, kasaMat=mat('#1d1a14');
  for(const[x,y,w,h]of[[kx-kg/2-.04,kh/2,.08,kh],[kx+kg/2+.04,kh/2,.08,kh],[kx,kh+.04,kg+.16,.08]]){const m=ekle(new THREE.Mesh(new THREE.BoxGeometry(w,h,.1),kasaMat)); m.position.set(x,y,ODA.arka+.03); sahne.add(m);}
  const kapiIc=new THREE.Mesh(new THREE.PlaneGeometry(kg,kh),new THREE.MeshBasicMaterial({color:new THREE.Color(PAL.soguk).multiplyScalar(.35),fog:false}));
  kapiIc.position.set(kx,kh/2,ODA.arka-.02); sahne.add(kapiIc);
  const mente=new THREE.Group(); mente.position.set(kx+kg/2,0,ODA.arka); mente.rotation.y=-.24; sahne.add(mente);
  const kanat=ekle(new THREE.Mesh(new THREE.BoxGeometry(kg,kh,.045),mat('#16140f'))); kanat.position.set(-kg/2,kh/2,0); mente.add(kanat);
  const tokmak=ekle(new THREE.Mesh(new THREE.SphereGeometry(.03,12,8),mat('#4a4434',{metalness:.6,roughness:.4}))); tokmak.position.set(-kg+.08,1.0,.05); mente.add(tokmak);
  const sizinti=new THREE.SpotLight(PAL.soguk,1.4,4,.5,.9,2); sizinti.position.set(kx-.2,1.6,ODA.arka-.5); sizinti.target.position.set(kx-.6,0,ODA.arka+1.2); sahne.add(sizinti,sizinti.target);
}

/* ───────────── çıplak ampul: sallanır, cızırdar ───────────── */
const AMPUL={asma:new THREE.Vector3(-.52,ODA.tavan,.18), boy:1.12};
const isik=new THREE.PointLight(PAL.lamba,9,0,2);
isik.castShadow=true; isik.shadow.mapSize.set(1024,1024); isik.shadow.bias=-.002; isik.shadow.radius=4; isik.shadow.camera.near=.05;
const ampulMesh=new THREE.Mesh(new THREE.SphereGeometry(.022,16,12),new THREE.MeshBasicMaterial({color:'#fff3d2',fog:false}));
ampulMesh.scale.y=1.3;
const ampulHale=new THREE.Sprite(new THREE.SpriteMaterial({map:dumanDoku,color:new THREE.Color('#ffd890').multiplyScalar(3),transparent:true,opacity:.55,depthWrite:false,blending:THREE.AdditiveBlending,fog:false}));
ampulHale.scale.set(.9,.9,1);
const duy=new THREE.Mesh(new THREE.CylinderGeometry(.018,.022,.05,10),mat('#0a0908'));
const kablo=new THREE.Mesh(new THREE.CylinderGeometry(.004,.004,1,6),mat('#050505'));
sahne.add(isik,ampulMesh,ampulHale,duy,kablo);
sahne.add(new THREE.HemisphereLight('#3a4a40','#1a1220',.35)); // gölgeler mutlak siyaha düşmesin diye çok az dolgu

/* ───────────── masa ve üstündekiler ───────────── */
const duman=[];
{
  const T=OLCU.masaY;
  const tabla=ekle(new THREE.Mesh(new THREE.BoxGeometry(2.1,.05,.85),mat('#ffffff',{map:tahtaDoku,roughness:.8}))); tabla.position.set(0,T-.025,.58); sahne.add(tabla);
  const onYuz=ekle(new THREE.Mesh(new THREE.BoxGeometry(2.1,.75,.03),mat('#120d09'))); onYuz.position.set(0,T-.42,1.0); sahne.add(onYuz);
  // açık defter: iki sayfa, hafif kalkık
  const defter=new THREE.Group(); defter.position.set(-.32,T+.004,.34); defter.rotation.y=.12; sahne.add(defter);
  for(const s of[-1,1]){
    const g=new THREE.PlaneGeometry(.2,.27,8,1); const p=g.attributes.position; for(let i=0;i<p.count;i++){const x=p.getX(i); p.setZ(i,Math.sin(Math.abs(x+ s*.1)/.2*Math.PI*.5)*.012);} g.computeVertexNormals();
    const m=ekle(new THREE.Mesh(g,mat(s<0?'#ffffff':'#c9c4b0',{map:sayfaDoku}))); m.rotation.x=-Math.PI/2; m.position.x=s*.1; defter.add(m);
  }
  const kalem=ekle(new THREE.Mesh(new THREE.CylinderGeometry(.004,.004,.13,8),mat('#3a2f1c'))); kalem.rotation.set(Math.PI/2,0,1.1); kalem.position.set(.05,.008,.16); defter.add(kalem);
  // dosya
  const dosya=ekle(new THREE.Mesh(new THREE.BoxGeometry(.32,.012,.24),mat('#4a3d27'))); dosya.position.set(.42,T+.006,.3); dosya.rotation.y=-.08; sahne.add(dosya);
  const dosyaEtiket=new THREE.Mesh(new THREE.PlaneGeometry(.1,.03),mat('#7a7260')); dosyaEtiket.rotation.x=-Math.PI/2; dosyaEtiket.position.set(.38,T+.013,.27); sahne.add(dosyaEtiket);
  // ters çevrilmiş olay yeri fotoğrafları
  for(const[x,z,a]of[[.04,.24,.22],[-.02,.28,-.16],[.1,.31,.5]]){const m=ekle(new THREE.Mesh(new THREE.BoxGeometry(.13,.002,.09),mat('#36342c'))); m.position.set(x,T+.002+Math.random()*.002,z); m.rotation.y=a; sahne.add(m);}
  // teneke kül tablası ve sigara
  const kul=new THREE.Group(); kul.position.set(.72,T,.36); sahne.add(kul);
  kul.add(ekle(new THREE.Mesh(new THREE.CylinderGeometry(.07,.065,.025,24,1,true),mat('#2a2926',{metalness:.5,roughness:.5,side:THREE.DoubleSide}))));
  kul.children[0].position.y=.0125;
  const kulTaban=ekle(new THREE.Mesh(new THREE.CircleGeometry(.065,24),mat('#0a0a0a'))); kulTaban.rotation.x=-Math.PI/2; kulTaban.position.y=.004; kul.add(kulTaban);
  const sigara=ekle(new THREE.Mesh(new THREE.CylinderGeometry(.004,.004,.07,8),mat('#9a947e'))); sigara.rotation.set(0,0,Math.PI/2-.2); sigara.position.set(.03,.02,0); kul.add(sigara);
  const kor=new THREE.Mesh(new THREE.SphereGeometry(.0045,8,6),new THREE.MeshBasicMaterial({color:'#ff6a2a'})); kor.position.set(.065,.027,0); kul.add(kor);
  for(let i=0;i<34;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:dumanDoku,color:'#8a887a',transparent:true,opacity:0,depthWrite:false})); s.userData={faz:i/34,yon:Math.random()*TAU}; sahne.add(s); duman.push(s);}
  duman.kok=new THREE.Vector3(.72+.065,T+.03,.36);
}

/* ───────────── sandalye ───────────── */
{
  const m=mat('#17120d');
  for(const s of[-1,1]){const d=ekle(new THREE.Mesh(new THREE.BoxGeometry(.04,1.02,.04),m)); d.position.set(s*.23,.51,-.32); sahne.add(d);}
  const sirt=ekle(new THREE.Mesh(new THREE.BoxGeometry(.5,.07,.03),m)); sirt.position.set(0,.98,-.32); sahne.add(sirt);
}

/* ───────────── karakter: kafa ölçüsünde kurulur, sonra ölçeklenir ───────────── */
const kadin=new THREE.Group(); kadin.position.set(0,OLCU.kafaY,-.05); kadin.scale.setScalar(OLCU.kafaOlcek); sahne.add(kadin);
const kafaG=new THREE.Group(); kadin.add(kafaG);
const ELIPS=new THREE.Vector3(.78,1,.86);

function yuzGeometrisi(){
  const g=new THREE.SphereGeometry(1,160,120), p=g.attributes.position, n=p.count;
  const renk=new Float32Array(n*3), v=new THREE.Vector3(), r=rng(7);
  const C=k=>new THREE.Color(PAL[k]);
  const ten=C('ten'), golge=C('tenGolge'), orta=C('tenOrta'), mor=C('morluk'), dudak=C('dudak'), isikT=C('tenIsik');
  const tumsek=[]; const T=(x,y,z,a,s)=>tumsek.push([new THREE.Vector3(x,y,z).normalize(),a,s]);
  for(const s of[-1,1]){
    T(s*.37,.12,.92,-.15,.15);   // çökük göz çukuru
    T(s*.34,.31,.89,.035,.09);   // kaş kemiği
    T(s*.54,.02,.8,.06,.11);    // elmacık
    T(s*.5,-.36,.74,-.1,.14);   // çökük yanak
    T(s*.76,.25,.45,-.03,.15);   // şakak
    T(s*.085,-.27,.95,.022,.04); // burun kanadı

  const b=new THREE.Vector3(Math.sin(ax)*AMPUL.boy,-Math.cos(ax)*Math.cos(az)*AMPUL.boy,Math.sin(az)*AMPUL.boy).add(AMPUL.asma);
  ampulMesh.position.copy(b); ampulHale.position.copy(b); isik.position.copy(b).y-=.01;
  const yon=new THREE.Vector3().subVectors(AMPUL.asma,b).normalize();
  duy.position.copy(b).addScaledVector(yon,.05); duy.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),yon);
  kablo.position.copy(b).add(AMPUL.asma).multiplyScalar(.5); kablo.scale.y=AMPUL.boy; kablo.quaternion.copy(duy.quaternion);
  isik.intensity=9*poz.isik; ampulMesh.material.color.setRGB(9,7.6,5).multiplyScalar(.15+.85*poz.isik); ampulHale.material.opacity=.8*poz.isik;

  // karakter: baş bakışı ağır izler, gözler hızlı; nefes
  kafaG.rotation.set(poz.hgy*.08,poz.hgx*.16,-poz.hgx*.03);
  for(const g of gozler) g.rotation.set(poz.gy*.28,poz.gx*.42,0);
  for(const k of kapaklar) k.rotation.x=lerp(.52,-.36,clamp(poz.goz,0,1)/.74*.86);
  govde.position.y=govde.userData.y+poz.nefes*.035; govde.scale.set(1+poz.nefes*.006,1,1+poz.nefes*.01);
  const a=poz.agizAc; agizIc.scale.y=.08+a*.75; agizIc.position.y=-.475-a*.025; altDudak.position.y=-.51-a*.06; ustDudak.position.y=-.445+a*.01;

  // duman
  for(const s of duman){
    const f=(s.userData.faz+t*.08)%1, y=f*.55;
    s.position.set(duman.kok.x+Math.sin(y*6+t*1.1+s.userData.yon)*(.01+f*.08)+f*.06,duman.kok.y+y,duman.kok.z+Math.cos(y*5+t*.9+s.userData.yon)*f*.05);
    const o=.03+f*.25; s.scale.set(o,o,1); s.material.opacity=(azHareket?0:1)*Math.sin(f*Math.PI)*.38*(1-f*.4);
  }

  // kamera: imleçle hafifçe kayar, yüze bakar
  kam.position.set(poz.kam*.14,OLCU.kameraY-poz.kamY*.04,OLCU.kameraZ);
  kam.lookAt(poz.kam*.03,OLCU.kafaY-.19,-.05);
  sonIslem.uniforms.kaynama.value=azHareket?0:Math.floor(t*OLCU.kaynamaHizi)%64;
  sonIslem.uniforms.zaman.value=azHareket?0:t;
}

let onceki=performance.now();
function kare(now){
  requestAnimationFrame(kare);
  if(vw<8||vh<8){boyutla(); return;}
  const dt=Math.min(.05,(now-onceki)/1000); onceki=now;
  guncelle(now/1000,dt);
  ren.setRenderTarget(hedef); ren.render(sahne,kam);
  ren.setRenderTarget(null); ren.render(sonSahne,sonKam);
}
requestAnimationFrame(kare);
window.sorgu3b={poz,PAL,OLCU,KONUSMA,konus,sahne,kam};
</script>
